<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bug Bounty Tracker{% endblock %}</title>
    <style>
        :root { --bg:#0f1115; --card:#1a1d24; --text:#e6e6e6; --muted:#9aa0aa;
               --accent:#4f9dff; --danger:#ff5d5d; --ok:#3ecf8e; --border:#2a2e37; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, -apple-system, sans-serif;
               background:var(--bg); color:var(--text); line-height:1.5; }
        a { color:var(--accent); text-decoration:none; }
        a:hover { text-decoration:underline; }
        header { background:var(--card); border-bottom:1px solid var(--border);
                 padding:.75rem 1.25rem; display:flex; justify-content:space-between;
                 align-items:center; }
        header .brand { font-weight:700; color:var(--text); }
        .nav a { margin-left:1rem; color:var(--muted); }
        .nav a:hover { color:var(--text); }
        main { max-width:960px; margin:0 auto; padding:1.5rem; }
        .card { background:var(--card); border:1px solid var(--border);
                border-radius:8px; padding:1rem 1.25rem; margin-bottom:1rem; }
        .card h3 { margin:0 0 .25rem; }
        .muted { color:var(--muted); font-size:.9rem; }
        .btn { display:inline-block; background:var(--accent); color:#07111f;
               padding:.45rem .9rem; border-radius:6px; font-weight:600;
               border:none; cursor:pointer; }
        .btn:hover { opacity:.9; text-decoration:none; }
        .btn.danger { background:var(--danger); color:#1a0606; }
        .btn.small { padding:.3rem .6rem; font-size:.85rem; }
        form label { display:block; margin:.6rem 0 .2rem; color:var(--muted); }
        form input[type=text], form input[type=password], form input[type=url],
        form input[type=datetime-local], form select, form textarea {
            width:100%; padding:.5rem; background:#0c0e12; color:var(--text);
            border:1px solid var(--border); border-radius:6px; }
        .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
        .tag { display:inline-block; padding:.12rem .5rem; border-radius:99px;
               font-size:.75rem; background:#222833; color:var(--muted);
               border:1px solid var(--border); }
        .tag.found { background:#14361f; color:var(--ok); }
        .tag.scope { background:#13314f; color:var(--accent); }
        .msg { padding:.6rem .9rem; border-radius:6px; margin-bottom:1rem; }
        .msg.success { background:#14361f; color:var(--ok); }
        .msg.error { background:#3a1414; color:var(--danger); }
        table { width:100%; border-collapse:collapse; }
        th, td { text-align:left; padding:.5rem; border-bottom:1px solid var(--border); }
    </style>
</head>
<body>
    <header>
        <span class="brand"><a href="{% url 'dashboard' %}">🎯 Bug Bounty Tracker</a></span>
        <span class="nav">
            {% if user.is_authenticated %}
                <a href="{% url 'findings' %}">Findings</a>
                <span class="muted">{{ user.username }}</span>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </span>
    </header>
    <main>
        {% if messages %}
            {% for m in messages %}
                <div class="msg {{ m.tags }}">{{ m }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
